# Manual release: Actions → Release → Run workflow
# (or: gh workflow run release.yml -R narcisoaf/mcp-hub).
#
# Publishes GitHub Release v<version> (version from Cargo.toml) with one archive
# per platform. Flow: create a draft release → build, test and upload on each
# platform in parallel → publish. A published release is never overwritten:
# bump the version in Cargo.toml to release again. A draft left behind by a
# failed run is replaced automatically on the next run.
#
# Artifacts go straight to the release with the preinstalled gh CLI, so jobs
# share nothing through actions/upload-artifact.
name: Release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Mark the release as a pre-release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  draft:
    name: Create draft release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.draft.outputs.tag }}
      version: ${{ steps.draft.outputs.version }}
    steps:
      # Only Cargo.toml is needed here: read it through the API instead of checking out.
      - id: draft
        run: |
          version="$(gh api "repos/$GH_REPO/contents/Cargo.toml?ref=$GITHUB_SHA" --jq .content \
            | base64 -d | sed -n 's/^version = "\(.*\)"$/\1/p' | head -n 1)"
          [[ -n "$version" ]] || { echo "::error::no version in Cargo.toml"; exit 1; }
          tag="v$version"
          if draft="$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [[ "$draft" != "true" ]]; then
              echo "::error::release $tag is already published; bump the version in Cargo.toml first"
              exit 1
            fi
            echo "Replacing draft $tag left by an earlier run"
            gh release delete "$tag" --yes
          fi
          gh release create "$tag" --draft --target "$GITHUB_SHA" \
            --title "mcp-hub $version" --generate-notes
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: draft
    strategy:
      fail-fast: true
      matrix:
        include:
          # Built on the oldest supported Ubuntu so the binary's glibc needs stay low.
          - name: linux-x86_64
            os: ubuntu-24.04
            targets: x86_64-unknown-linux-gnu
          # Universal binary: Apple Silicon and Intel.
          - name: macos-universal
            os: macos-26
            targets: aarch64-apple-darwin x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      DIST: mcp-hub-${{ needs.draft.outputs.version }}-${{ matrix.name }}
      TARGETS: ${{ matrix.targets }}
      TAG: ${{ needs.draft.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          read -ra targets <<< "$TARGETS"
          rustup target add "${targets[@]}"

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      # Tests and the build share one release-profile dependency build per target.
      - name: Test
        run: cargo test --release --locked --target "${TARGETS%% *}"

      - name: Build
        run: |
          args=()
          for t in $TARGETS; do args+=(--target "$t"); done
          cargo build --release --locked "${args[@]}"

      - name: Assemble binary
        run: |
          bins=()
          for t in $TARGETS; do bins+=("target/$t/release/mcp-hub"); done
          if [[ "$RUNNER_OS" == macOS ]]; then
            lipo -create -output mcp-hub "${bins[@]}"
            lipo -info mcp-hub
          else
            cp "${bins[0]}" mcp-hub
          fi

      # Signed with mcp-hub's own self-signed certificate (secrets MACOS_SIGN_P12, base64 of
      # a PKCS#12 file, and MACOS_SIGN_PASSWORD; see "Releasing" in the README). Not trusted
      # by Apple, and need not be: it gives every release the same identity, so permissions
      # given in Privacy & Security stay after an update. (Not the Keychain's: that needs an
      # Apple Team ID.)
      - name: Sign
        if: runner.os == 'macOS'
        env:
          SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
        run: |
          if [[ -z "$SIGN_P12" || -z "$SIGN_PASSWORD" ]]; then
            echo "::error::secrets MACOS_SIGN_P12 and MACOS_SIGN_PASSWORD are not set"
            exit 1
          fi
          keychain="$RUNNER_TEMP/sign.keychain-db"
          keychain_password="$(uuidgen)"
          trap 'security delete-keychain "$keychain" 2>/dev/null || true; rm -f "$RUNNER_TEMP/sign.p12"' EXIT
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 900 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$SIGN_P12" | base64 --decode > "$RUNNER_TEMP/sign.p12"
          security import "$RUNNER_TEMP/sign.p12" -k "$keychain" -P "$SIGN_PASSWORD" \
            -T /usr/bin/codesign >/dev/null
          # Let codesign use the key without a dialog.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" \
            "$keychain" >/dev/null
          # codesign looks for the key in the search list only.
          old_keychains=()
          while IFS= read -r line; do
            line="${line#"${line%%[![:space:]]*}"}"
            old_keychains+=("${line//\"/}")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${old_keychains[@]}"
          # By its SHA-1, not its name: codesign looks names up among trusted certificates
          # only, and a self-signed one is not. (Without -v, find-identity lists those too.)
          security find-identity -p codesigning "$keychain"
          identity="$(security find-identity -p codesigning "$keychain" |
            awk '/"mcp-hub release"/ { print $2; exit }')"
          [[ -n "$identity" ]] || { echo "::error::no mcp-hub release identity in the secrets"; exit 1; }
          codesign --force --keychain "$keychain" --sign "$identity" --identifier dev.mcp-hub mcp-hub
          codesign --display --verbose=2 mcp-hub 2>&1 | grep -E '^(Identifier|Authority|Signature)='
          codesign --display --requirements - mcp-hub 2>&1 | grep designated

      - name: Check binary
        run: ./mcp-hub --version

      - name: Package and upload
        run: |
          mkdir -p "$DIST/systemd" "$DIST/launchd"
          cp mcp-hub bin/install-service.sh README.md config.example.json "$DIST/"
          cp systemd/mcp-hub.service.in "$DIST/systemd/"
          cp launchd/dev.mcp-hub.plist.in "$DIST/launchd/"
          tar -czf "$DIST.tar.gz" "$DIST"
          shasum -a 256 "$DIST.tar.gz" > "$DIST.tar.gz.sha256"
          gh release upload "$TAG" "$DIST.tar.gz" "$DIST.tar.gz.sha256" --clobber

  publish:
    name: Publish release
    needs: [draft, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - env:
          TAG: ${{ needs.draft.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: gh release edit "$TAG" --draft=false --prerelease="$PRERELEASE"
